          // Dotted outline left behind while the block is gone, so the player knows it comes back
          const ghost = this.add.rectangle((c + w / 2) * TILE, (r + 0.5) * TILE, w * TILE - 2, TILE - 2)
            .setStrokeStyle(2, CRUMBLE_COLOR, 0.35).setVisible(false);
          this.roomArt.add(ghost);
          const block = { zone, art, ghost, state: 'solid', until: 0 };
          zone.block = block;
          this.crumbleBlocks.push(block);
        }
        for (const { c, r, w } of tileRuns(grid, 'K')) {
          // The trigger covers the whole run; a flag post stands in its middle on the tile below, and the player
          // restarts just left of it (so the post stays in sight)
          const zone = this.add.zone((c + w / 2) * TILE, (r + 0.5) * TILE, w * TILE, TILE);
          this.checkpoints.add(zone);
          const x = (c + w / 2) * TILE, foot = (r + 1) * TILE;
          this.roomArt.add(ART.on ? this.add.image(x + 6, foot, 'art', 'cp_post').setOrigin(0.5, 1)
                                  : this.add.rectangle(x + 6, foot, 4, TILE * 1.6, 0xdddddd).setOrigin(0.5, 1));
          const flag = ART.on ? this.add.image(x + 8, foot - TILE * 1.6, 'art', 'cp_flag').setOrigin(0)
                              : this.add.triangle(x + 8, foot - TILE * 1.6, 0, 0, 22, 9, 0, 18, CHECKPOINT_COLOR).setOrigin(0);
          this.roomArt.add(flag);
          const spot = { x: x - 14, y: foot - PLAYER_SIZE / 2 };
          const lit = this.checkpoint && this.checkpoint.x === spot.x && this.checkpoint.y === spot.y;
          if (lit) this.lightFlag(flag);
          zone.checkpoint = { ...spot, flag, lit };
        }
        grid.forEach((row, r) => [...row].forEach((ch, c) => {
          const x = c * TILE, y = r * TILE;
          if (ch === '^') {
            if (ART.on) {
              this.roomArt.add(this.add.image(x, y, 'art', 'spikes').setOrigin(0));
            } else {
              this.roomArt.add(this.add.triangle(x, y, 0, TILE, TILE / 4, 4, TILE / 2, TILE, 0xe0475b).setOrigin(0));
              this.roomArt.add(this.add.triangle(x + TILE / 2, y, 0, TILE, TILE / 4, 4, TILE / 2, TILE, 0xe0475b).setOrigin(0));
            }
            const { insetX, insetTop } = SPIKE_HITBOX;
            const hit = this.add.zone(x + TILE / 2, y + (TILE + insetTop) / 2, TILE - 2 * insetX, TILE - insetTop);
            this.spikes.add(hit);
          } else if (ch === 'D' || ch === 'G' || ch === 'B') {
            // Door / flag stands on the tile below and is two tiles tall
            const zone = this.add.zone(x + TILE / 2, y, TILE, TILE * 2);
            zone.isGoal = ch === 'G';
            zone.isBonus = ch === 'B';
            this.exits.add(zone);
            if (zone.isGoal && ART.on) {
              this.roomArt.add(this.add.image(x, y - TILE, 'art', 'flag').setOrigin(0));
            } else if (zone.isBonus && ART.on) {
              // The same signs as the plain version: a slow violet glow ("a side trip") and a crown of red spikes ("hard")
              const inBonus = i >= 0 && ROOMS[i].kind === 'optional';
              if (!inBonus) {
                const glow = this.pixel.glow(x + TILE / 2, y, 0xb48cf0, 70, 0.8).setDepth(-0.5);
                this.roomArt.add(glow);
                this.tweens.add({ targets: glow, alpha: 0.2, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
              }
              this.roomArt.add(this.add.image(x, y - TILE - 16, 'art', inBonus ? 'bonus_door_back' : 'bonus_door').setOrigin(0));
            } else if (ART.on) {
              this.roomArt.add(this.add.image(x + TILE / 2, y, 'art', 'door'));
            } else if (zone.isGoal) {
              this.roomArt.add(this.add.rectangle(x + 6, y, 4, TILE * 2, 0xdddddd));
              this.roomArt.add(this.add.triangle(x + 8, y - TILE + 2, 0, 0, 22, 9, 0, 18, 0xffe14d).setOrigin(0));
            } else if (zone.isBonus) {
              // Purple door with a star: clearly not the way on
              const inBonus = i >= 0 && ROOMS[i].kind === 'optional';
              if (!inBonus) {
                // The way into a bonus room: a slow glow says "special, a side trip", and a crown of spikes in the
                // game's danger red says "hard" (art only, they don't hurt)
                const glow = this.add.rectangle(x + TILE / 2, y, TILE + 12, TILE * 2 + 12, 0xb48cf0, 0.5);
                this.roomArt.add(glow);
                this.tweens.add({ targets: glow, alpha: 0.1, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
              }
              this.roomArt.add(this.add.rectangle(x + TILE / 2, y, TILE - 4, TILE * 2, 0x5b3b8a).setStrokeStyle(3, 0xb48cf0));
              this.roomArt.add(this.add.star(x + TILE / 2, y - 10, 5, 3, 7, 0xffe14d));
              if (!inBonus) {
                for (let k = 0; k < 2; k++) {
                  this.roomArt.add(this.add.triangle(x + 2 + k * 14, y - TILE - 13, 0, 14, 7, 0, 14, 14, 0xe0475b).setOrigin(0));
                }
              }
            } else {
              this.roomArt.add(this.add.rectangle(x + TILE / 2, y, TILE - 4, TILE * 2, 0x8a5a3b).setStrokeStyle(3, 0xc58b5c));
              this.roomArt.add(this.add.circle(x + TILE - 9, y + 4, 3, 0xffe14d));
            }
          } else if (ch === 'S') {
            // A low pad on the floor of its cell; the trigger covers the pad, so walking onto it bounces too
            const pad = ART.on ? this.add.image(x + TILE / 2, y + TILE - 5, 'art', 'spring_pad').setOrigin(0.5, 1)
                               : this.add.rectangle(x + TILE / 2, y + TILE - 5, TILE - 2, 8, 0x5fd36b).setOrigin(0.5, 1);
            const coil = ART.on ? this.add.image(x + TILE / 2, y + TILE, 'art', 'spring_coil').setOrigin(0.5, 1)
                                : this.add.rectangle(x + TILE / 2, y + TILE, TILE - 12, 5, 0x2f7a3a).setOrigin(0.5, 1);
            this.roomArt.add(coil);
            this.roomArt.add(pad);
            const zone = this.add.zone(x + TILE / 2, y + TILE - 6, TILE - 4, 12);
            zone.pad = pad;
            this.springs.add(zone);
          } else if (ch === 'O') {
            // Floats in the middle of its cell; the trigger is a little bigger than the gem
            const cx = x + TILE / 2, cy = y + TILE / 2;
            const zone = this.add.zone(cx, cy, 26, 26);
            this.orbs.add(zone);
            const gem = ART.on ? this.add.image(cx, cy, 'art', 'orb')
                               : this.add.rectangle(cx, cy, 15, 15, ORB_COLOR).setAngle(45).setStrokeStyle(2, 0xffffff);
            const ghost = (ART.on ? this.add.image(cx, cy, 'art', 'orb_ghost')
                                  : this.add.rectangle(cx, cy, 15, 15).setAngle(45).setStrokeStyle(2, ORB_COLOR, 0.35)).setVisible(false);
            this.roomArt.add(ghost);
            this.roomArt.add(gem);
            const orb = { zone, gem, ghost, baseY: cy, ready: true, until: 0 };
            zone.orb = orb;
            this.orbList.push(orb);
          } else if (ch === '*') {
            this.addStar(x + TILE / 2, y + TILE / 2, starKey(room ? room.name : 'test', c, r));
          } else if (ch === 'P') {
            this.spawn = { x: x + TILE / 2, y: y + TILE - PLAYER_SIZE / 2 };
          }
        }));
        if (room?.kind === 'rest') this.campfire();
        if (room?.vista) this.vista(room.vista);
        if (this.chase) this.buildStorm();

        const start = this.checkpoint || this.spawn;
        this.player.setPosition(start.x, start.y).setFillStyle(PLAYER_COLOR);
        this.player.body.reset(start.x, start.y);
        this.player.body.setEnable(true);
        this.lastGrounded = -Infinity;
        this.jumpPressed = false;
        this.jumpBuffer = 0;
        this.rising = false;
        this.sprung = false;
        this.airJumpsLeft = AIR_JUMPS;
        // Jumps straight to the player, then follows sideways; in a chase it looks ahead, away from the storm
        this.cameras.main.startFollow(this.player, true, 1, 1, this.chase ? -CHASE_LOOK_AHEAD : 0, 0);
        if (i >= 0 && ROOMS[i].kind === 'optional') {
          this.roomText.setText(`Section ${ROOMS[i].section} · Area ${ROOMS[i].area} · Bonus room`);
        } else if (i >= 0 && ROOMS[i].kind === 'rest') {
          this.roomText.setText(`Section ${ROOMS[i].section} · ${SECTIONS[ROOMS[i].section - 1].name}`);
          this.showMap(ROOMS[i].section);
        } else if (i >= 0) {
          const { section, area } = ROOMS[i];
          const inArea = ROOMS.filter(r => r.area === area && r.kind !== 'optional' && r.kind !== 'rest');
          this.roomText.setText(`Section ${section} · Area ${area} · Room ${inArea.indexOf(ROOMS[i]) + 1} / ${inArea.length}`);
        } else {
          this.roomText.setText('Test room');
        }
        this.pixel?.room(grid, i);
        this.fx.roomLoaded(atCheckpoint);
        this.sfx.roomLoaded(atCheckpoint);
      }

      // ---- Stars ----
      // A star bobs in its cell. One already banked in this run is a faint outline that can't be taken again.
      addStar(x, y, key) {
        const have = this.collected.has(key);
        const glow = !have && this.pixel ? this.pixel.glow(x, y, STAR_COLOR, 34, 0.55).setDepth(-0.5) : null;
        const shape = this.add.star(x, y, 5, 6, 13, have ? 0 : STAR_COLOR, have ? 0 : 1).setStrokeStyle(2, have ? STAR_COLOR : 0xfff4c0)
          .setAlpha(have ? 0.35 : 1).setDepth(0.9);
        this.roomArt.add(shape);
        if (glow) this.roomArt.add(glow);
        this.tweens.add({ targets: [shape, glow].filter(Boolean), y: y - 4, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
        if (!have) this.tweens.add({ targets: shape, angle: 360, duration: 6000, repeat: -1 });
        if (have) return;
        const zone = this.add.zone(x, y, 24, 24);
        zone.star = { key, shape, glow, zone };
        this.starZones.add(zone);
      }

      // Picked up: it rides above the player until they leave through the exit (then it counts) or die (then it's back)
      touchStar(star) {
        if (this.heldStar || this.dying || this.won) return;
        this.heldStar = star;
        star.zone.body.enable = false;
        this.tweens.killTweensOf([star.shape, star.glow].filter(Boolean));
        star.shape.setScale(0.75);
        const ring = this.add.circle(star.shape.x, star.shape.y, 10).setStrokeStyle(3, STAR_COLOR);
        this.roomArt.add(ring);
        this.tweens.add({ targets: ring, scale: 3, alpha: 0, duration: 300, onComplete: () => ring.destroy() });
        this.sfx.star();
      }

      updateHeldStar() {
        const st = this.heldStar;
        if (!st) return;
        const x = this.player.x, y = this.player.y - 30 + Math.sin(this.roomTime * 5) * 2;
        st.shape.setPosition(x, y).setVisible(this.player.body.enable);
        st.glow?.setPosition(x, y).setVisible(this.player.body.enable);
      }

      updateStarText() {
        const text = `${this.collected.size} / ${STARS.length}`;
        if (this.starText.text !== text) this.starText.setText(text);
        const show = STARS.length > 0;
        this.starText.setVisible(show);
        this.starIcon.setVisible(show);
      }

      // ---- Rest spots ----
      // A campfire a few steps right of the start: warm light, a flickering flame, the place to catch a breath
      campfire() {
        const x = this.spawn.x + 3 * TILE, foot = this.spawn.y + PLAYER_SIZE / 2;
        const add = (o) => { this.roomArt.add(o); return o; };
        add(this.add.rectangle(x - 9, foot - 3, 22, 6, 0x5a3a24).setAngle(-14).setDepth(-0.4));
        add(this.add.rectangle(x + 9, foot - 3, 22, 6, 0x6e4a2c).setAngle(14).setDepth(-0.4));
        const flame = add(ART.on ? this.add.image(x, foot - 4, 'art', 'flame0').setOrigin(0.5, 1).setScale(2).setDepth(-0.3)
                                 : this.add.triangle(x, foot - 4, 0, 22, 9, 0, 18, 22, 0xff9a3a).setOrigin(0.5, 1).setDepth(-0.3));
        this.tweens.add({ targets: flame, scaleY: flame.scaleY * 0.8, scaleX: flame.scaleX * 1.1, duration: 180, yoyo: true, repeat: -1 });
        if (this.pixel) {
          const g = add(this.pixel.glow(x, foot - 18, 0xff9a3a, 90, 0.5).setDepth(-0.5));
          this.tweens.add({ targets: g, alpha: 0.35, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
        }
      }

      // What lies ahead, far off and out of reach: a small floating island in the sky with the next section's element
      // on it, or the storm gathering on the horizon. Background only (no bodies), dimmed so it can't pass for a ledge.
      vista(kind) {
        const add = (o) => { this.roomArt.add(o.setDepth(-6)); return o; };
        if (kind === 'storm') {
          for (let k = 0; k < 7; k++) {
            add(this.add.ellipse(20 + k * 22, 70 + k * 34, 230 - k * 14, 120, STORM_COLOR, 0.85));
          }
          const bolt = add(this.add.polygon(150, 120, [0, 0, 14, 0, 6, 26, 18, 26, -4, 66, 2, 34, -10, 34], STORM_EDGE).setAlpha(0));
          this.tweens.add({ targets: bolt, alpha: { from: 0, to: 0.9 }, duration: 90, yoyo: true, repeat: -1, repeatDelay: 2300 });
          return;
        }
        // Small, hazy and blue-grey, so it reads as far away and not as a ledge to jump to
        const cx = 610, cy = 130, k = 0.6, haze = 0x7f88b0;
        add(this.add.ellipse(cx, cy + 9, 96, 22, 0x1c2240, 1));
        add(this.add.rectangle(cx, cy + 1, 88, 6, 0x2a3352, 1));
        const items = { spring: ['spring'], crumble: ['crumble', 'crumble', 'crumble'], orb: ['orb'], mix: ['crumble', 'orb', 'spring'] }[kind] || [];
        items.forEach((it, n) => {
          const x = cx + (n - (items.length - 1) / 2) * 34 * k, y = cy - 2;
          let o;
          if (it === 'spring') {
            o = ART.on ? this.add.image(x, y, 'art', 'spring_pad').setOrigin(0.5, 1) : this.add.rectangle(x, y, 26, 7, 0x5fd36b).setOrigin(0.5, 1);
          } else if (it === 'crumble') {
            o = ART.on ? this.add.image(x, y, 'art', 'crumble' + (n % 2)).setOrigin(0.5, 1)
                       : this.add.rectangle(x, y, 30, 30, CRUMBLE_COLOR).setOrigin(0.5, 1);
          } else {
            o = ART.on ? this.add.image(x, y - 26, 'art', 'orb') : this.add.rectangle(x, y - 26, 15, 15, ORB_COLOR).setAngle(45);
            this.tweens.add({ targets: o, y: y - 30, duration: 1000, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
            if (this.pixel) add(this.pixel.glow(x, y - 26, 0x74ece0, 18, 0.3));
          }
          add(o.setScale(k).setAlpha(0.7));
          if (o.setTint) o.setTint(haze); else o.setFillStyle(haze);
        });
      }

      // ---- The chapter map ----
      // Sections as stops on a path, left to right: finished ones lit with their stars found, the current one marked,
      // later ones dim, the storm at the end. Fills `box` (a container); returns what it shows, for tests.
      drawMap(box, current, y, detail = false) {
        box.removeAll(true);
        const n = SECTIONS.length, left = 150, right = GAME_WIDTH - 150;
        const xOf = k => n > 1 ? left + (right - left) * k / (n - 1) : GAME_WIDTH / 2;
        const font = (size, color) => ({ fontSize: size + 'px', color, fontFamily: 'sans-serif', align: 'center' });
        const info = [];
        for (let k = 0; k < n - 1; k++) {
          box.add(this.add.rectangle(xOf(k), y, xOf(k + 1) - xOf(k), 4, k + 1 < current ? 0xffd34d : 0x3a4060).setOrigin(0, 0.5));
        }
        SECTIONS.forEach((sec, k) => {
          const x = xOf(k), num = sec.number;
          const state = num < current ? 'done' : num === current ? 'here' : 'later';
          const finale = sec.rooms.some(r => r.kind === 'chase');
          const color = state === 'done' ? 0xffd34d : state === 'here' ? 0xf2b134 : 0x3a4060;
          if (finale) {
            box.add(this.add.ellipse(x - 7, y - 3, 22, 16, color));
            box.add(this.add.ellipse(x + 7, y - 5, 24, 20, color));
            box.add(this.add.polygon(x + 1, y + 13, [0, 0, 8, 0, 3, 9, 10, 9, -3, 24, 1, 13, -5, 13],
                                     state === 'later' ? 0x6b7390 : STORM_EDGE));
          } else {
            box.add(this.add.circle(x, y, 10, color).setStrokeStyle(2, state === 'later' ? 0x6b7390 : 0xfff4c0));
          }
          if (state === 'here' && !detail) {
            const ring = this.add.circle(x, y, 15).setStrokeStyle(3, 0xf2b134);
            box.add(ring);
            this.tweens.add({ targets: ring, scale: 1.35, alpha: 0.2, duration: 700, yoyo: true, repeat: -1 });
          }
          const total = STARS.filter(st => st.section === num).length;
          const found = STARS.filter(st => st.section === num && this.collected.has(st.key)).length;
          const lines = [sec.name];
          if (state === 'done' && total) lines.push(`${found} / ${total} ${total === 1 ? 'star' : 'stars'}`);
          if (state === 'here' && !detail) lines.push('you are here');
          if (detail) {
            const stat = this.sectionStats[k];
            lines.push(`${formatTime(stat.time, true)} · ${stat.deaths} ${stat.deaths === 1 ? 'death' : 'deaths'}`);
          }
          box.add(this.add.text(x, y + 22, lines.join('\n'), font(13, state === 'later' ? '#6b7390' : '#dfe3f0'))
            .setOrigin(0.5, 0).setLineSpacing(2));
          info.push({ section: num, state, finale, found, total });
        });
        return info;
      }

      // Shown whenever a rest spot loads; fades out once the player moves, or after MAP_TIME s
      showMap(section) {
        const box = this.mapOverlay;
        box.removeAll(true);
        box.add(this.add.rectangle(GAME_WIDTH / 2, 120, 620, 150, 0x05071a, 0.82).setStrokeStyle(2, 0x34405e));
        box.add(this.add.text(GAME_WIDTH / 2, 56, `Section ${section} · ${SECTIONS[section - 1].name}`,
                              { fontSize: '20px', color: '#ffe14d', fontFamily: 'sans-serif' }).setOrigin(0.5, 0));
        const inner = this.add.container(0, 0);
        box.add(inner);
        this.mapInfo = this.drawMap(inner, section, 112);
        box.setVisible(true).setAlpha(1);
        this.mapAge = 0;
        this.mapFading = false;
      }

      updateMap(dt, moving) {
        const box = this.mapOverlay;
        if (!box.visible) return;
        this.mapAge += dt;
        if (moving || this.mapAge > MAP_TIME) this.mapFading = true;
        if (this.mapFading) {
          box.alpha = Math.max(0, box.alpha - dt / 0.4);
          if (box.alpha <= 0) box.setVisible(false);
        }
      }

      // ---- The storm (chase rooms) ----
      // Its front moves on a fixed schedule from the room's (re)start: the same on every attempt
      stormFront() {
        const c = this.chase;
        return c.from + c.speed * Math.max(0, this.roomTime - c.delay);
      }

      buildStorm() {
        const add = (o) => { this.roomArt.add(o); return o; };
        this.storm = {
          wall: add(this.add.rectangle(0, 0, 2400, GAME_HEIGHT, STORM_COLOR, 0.93).setOrigin(1, 0).setDepth(1.4)),
          haze: add(this.add.rectangle(0, 0, 40, GAME_HEIGHT, 0x8a5cf0, 0.35).setOrigin(0, 0).setDepth(1.39)),
          edge: add(this.add.rectangle(0, 0, 5, GAME_HEIGHT, STORM_EDGE, 1).setOrigin(1, 0).setDepth(1.41)),
          sparks: [...Array(14)].map(() => add(this.add.rectangle(0, Math.random() * GAME_HEIGHT, 4, 4, STORM_EDGE, 0.9).setDepth(1.42))
            .setData('v', 40 + Math.random() * 80)),
        };
        this.stormMoving = false;
      }

      // Kill on touch, then draw: the wall up to the front, a bright flickering edge, sparks flying off it, and a band
      // at the screen edge while it's out of view
      updateStorm(dt) {
        if (!this.chase) return;
        const front = this.stormFront();
        const body = this.player.body;
        if (body.enable && !this.dying && !this.won && body.left < front) this.die();
        const moving = this.roomTime > this.chase.delay;
        if (moving && !this.stormMoving) this.sfx.stormMoves();
        this.stormMoving = moving;
        const st = this.storm, warn = !moving;
        st.wall.x = front;
        st.haze.x = front;
        st.edge.x = front;
        st.edge.alpha = warn ? 0.5 + 0.5 * Math.abs(Math.sin(this.roomTime * 14)) : 0.75 + 0.25 * Math.sin(this.roomTime * 30);
        st.haze.alpha = (warn ? 0.4 : 0.25) + 0.15 * Math.sin(this.roomTime * (warn ? 10 : 6));
        for (const sp of st.sparks) {
          sp.x = (sp.x > front && sp.x < front + 60) ? sp.x + sp.getData('v') * dt : front - Math.random() * 6;
          sp.y -= 20 * dt;
          if (sp.y < 0) sp.y += GAME_HEIGHT;
        }
        const cam = this.cameras.main;
        const off = cam.scrollX - front;  // > 0: the front is left of the view
        this.stormBand.setVisible(off > 0);
        if (off > 0) this.stormBand.alpha = (0.25 + 0.5 * clamp01(1 - off / 500)) * (0.8 + 0.2 * Math.sin(this.roomTime * 12));
      }

      // Crumbling block: standing on it starts the shake (touching its side or underside doesn't, and neither does
      // brushing its top corner on the way up past it)
      standOnCrumble(block) {
        if (block.state !== 'solid' || this.dying) return;
        const body = this.player.body;
        if (body.velocity.y < 0 || body.bottom > block.zone.body.top + 1) return;
        block.state = 'shaking';
        block.until = this.roomTime + CRUMBLE_DELAY;
      }

      updateCrumbles() {
        const p = this.player.body;
        for (const b of this.crumbleBlocks) {
          if (b.state === 'shaking') {
            const dx = Math.sin(this.roomTime * 70) * 2;
            for (const a of b.art) a.x = a.baseX + dx;
            if (this.roomTime >= b.until) {
              b.state = 'gone';
              b.until = this.roomTime + CRUMBLE_RETURN;
              b.zone.body.enable = false;
              b.ghost.setVisible(true);
              for (const a of b.art) a.x = a.baseX;
              this.tweens.add({ targets: b.art, y: '+=40', alpha: 0, duration: 250, ease: 'Quad.easeIn' });
            }
          } else if (b.state === 'gone' && this.roomTime >= b.until) {
            // Come back only once the player is out of the way, so it can't trap them
            const z = b.zone.body;
            const inside = p.enable && p.right > z.left && p.left < z.right && p.bottom > z.top && p.top < z.bottom;
            if (inside) continue;
            b.state = 'solid';
            b.zone.body.enable = true;
            b.ghost.setVisible(false);
            this.tweens.killTweensOf(b.art);
            for (const a of b.art) { a.setPosition(a.baseX, a.baseY); a.alpha = 0; }
            this.tweens.add({ targets: b.art, alpha: 1, duration: 150 });
          }
        }
      }

      // Checkpoint: the room restarts here after a death, until the player leaves the room
      touchCheckpoint(cp) {
        if (cp.lit || this.dying || this.won) return;
        cp.lit = true;
        this.checkpoint = { room: this.roomIndex, x: cp.x, y: cp.y };
        this.lightFlag(cp.flag);
        this.tweens.add({ targets: cp.flag, scaleX: 1.4, scaleY: 1.4, duration: 90, yoyo: true });
      }

      lightFlag(flag) {
        if (ART.on) flag.setFrame('cp_flag_lit');
        else flag.setFillStyle(CHECKPOINT_LIT_COLOR);
      }

      // Refill orb: gives the double jump back, but only if it's been spent (otherwise the orb stays for later)
      touchOrb(orb) {
        if (!orb.ready || this.dying || this.won || this.airJumpsLeft >= AIR_JUMPS) return;
        this.airJumpsLeft = AIR_JUMPS;
        orb.ready = false;
        orb.until = this.roomTime + ORB_RETURN;
        orb.gem.setVisible(false);
        orb.ghost.setVisible(true);
        const ring = this.add.circle(orb.gem.x, orb.gem.y, 10).setStrokeStyle(3, ORB_COLOR);
        this.roomArt.add(ring);
        this.tweens.add({ targets: ring, scale: 3, alpha: 0, duration: 250, onComplete: () => ring.destroy() });
      }

      updateOrbs() {
        for (const o of this.orbList) {
          if (!o.ready && this.roomTime >= o.until) {
            o.ready = true;
            o.gem.setVisible(true).setScale(0.3);
            o.ghost.setVisible(false);
            this.tweens.add({ targets: o.gem, scale: 1, duration: 150, ease: 'Back.easeOut' });
          }
          const y = o.baseY + Math.sin(this.roomTime * 3) * 3;  // bob gently so it reads as a pickup
          o.gem.y = y;
          o.ghost.y = y;
        }
      }

      // Spring pad: launch high, give back the double jump. Only from above (not while already rising).
      bounce(spring) {
        const body = this.player.body;
        if (this.dying || this.won || body.velocity.y < 0) return;
        body.maxVelocity.y = SPRING_VELOCITY;  // Phaser's cap works both ways; lift it for the rise (restored in update)
        body.setVelocityY(-SPRING_VELOCITY);
        this.airJumpsLeft = AIR_JUMPS;
        this.lastGrounded = -Infinity;  // no coyote jump off the pad: it would replace the bounce with a lower jump
        this.jumpBuffer = 0;            // a press made just before landing on the pad doesn't fire on the way up
        this.rising = false;            // releasing jump doesn't cut the bounce
        this.sprung = true;
        this.tweens.add({ targets: spring.pad, scaleY: 0.35, duration: 60, yoyo: true });
        this.fx.bounce(spring);
        this.sfx.bounce();
        this.pixel?.bounced();
      }

      die() {
        if (this.dying || this.won) return;
        this.dying = true;
        this.deaths++;
        const section = this.sectionStats[ROOMS[this.roomIndex]?.section - 1];
        if (section) section.deaths++;
        this.player.setFillStyle(0xe0475b);
        this.player.body.setEnable(false);
        this.fx.die();
        this.sfx.die();
        const room = this.roomIndex;
        this.time.delayedCall(DEATH_PAUSE, () => { if (this.roomIndex === room) this.loadRoom(room, this.grid, true); });
      }

      reachExit(exit) {
        if (this.dying || this.won) return;
        // Main path: a bonus door leads into the optional room right after this one; doors and flags skip optional
        // rooms. Optional room: its D clears it and goes on to the main room after the one it branched from (so the
        // player doesn't replay that room); its B leaves without clearing, back to the start of the branch room.
        let next = this.roomIndex + 1;
        const optional = ROOMS[this.roomIndex]?.kind === 'optional';
        if (optional && exit.isBonus) {
          next = this.roomIndex - 1;
        } else if (!exit.isBonus) {
          if (optional) this.bonusCleared.add(this.roomIndex);
          while (ROOMS[next]?.kind === 'optional') next++;
        }
        // A star held through the exit (not a bonus door back) counts
        if (this.heldStar && !exit.isBonus) {
          this.collected.add(this.heldStar.key);
          this.exitedWithStar = true;
        }
        // A test room's flag ends the chapter, and so does clearing a bonus room that branches off the last room
        const lastRoom = this.roomIndex < 0 || next >= ROOMS.length;
        if (lastRoom && (exit.isGoal || optional)) {
          this.won = true;
          this.player.body.setEnable(false);
          this.showEndScreen();
          this.fx.win(exit);
          this.sfx.win();
          return;
        }
        // Door, or the flag at the end of a section: on to the next room.
        // Swap rooms after this physics step, not in the middle of it
        this.dying = true;
        this.fx.exit(exit);
        this.sfx.exit(exit);
        this.time.delayedCall(0, () => this.loadRoom(next));
      }

      // Time, deaths and stars, then the chapter map with every section lit and its own time and deaths
      showEndScreen() {
        const lines = [`Time  ${formatTime(this.playTime)}`, `Deaths  ${this.deaths}`];
        // Every side room holds one star, so the stars also count the side rooms finished
        if (STARS.length) lines.push(`Stars  ${this.collected.size} / ${STARS.length}`);
        this.endBody.setText(lines.join('\n'));
        this.endMapInfo = this.drawMap(this.endMap, SECTIONS.length + 1, 330, true);
        this.endScreen.setVisible(true);
        this.mapOverlay.setVisible(false);
        this.updateStatsText();
        this.updateStarText();
      }

      updateStatsText() {
        const text = `Deaths ${this.deaths} · ${formatTime(this.playTime, true)}`;
        if (this.statsText.text !== text) this.statsText.setText(text);
      }

      update(time, delta) {
        const body = this.player.body;
        const k = this.keys;
        const left = k.LEFT.isDown || k.A.isDown;
        const right = k.RIGHT.isDown || k.D.isDown;
        const jumpHeld = k.UP.isDown || k.W.isDown || k.SPACE.isDown;

        // Chapter timer: runs until the end screen, including death pauses
        const dt = delta / 1000;
        this.roomTime += dt;
        if (!this.won) {
          this.playTime += dt;
          const section = this.sectionStats[ROOMS[this.roomIndex]?.section - 1];
          if (section) section.time += dt;
        }
        this.updateStatsText();
        this.updateStarText();
        this.updateCrumbles();
        this.updateOrbs();
        this.updateStorm(dt);
        this.updateHeldStar();
        this.updateMap(dt, left || right || jumpHeld);

        body.setAccelerationX(left === right ? 0 : (left ? -RUN_ACCEL : RUN_ACCEL));

        const onGround = this.onGround();
        if (onGround) {
          this.lastGrounded = time;
          this.airJumpsLeft = AIR_JUMPS;
        }

        // Jump buffer: a press stays queued for JUMP_BUFFER seconds
        this.jumpBuffer = this.jumpPressed ? JUMP_BUFFER : Math.max(0, this.jumpBuffer - delta / 1000);
        const jumpQueued = this.jumpPressed || this.jumpBuffer > 0;
        this.jumpPressed = false;
        if (jumpQueued && (time - this.lastGrounded) / 1000 <= COYOTE_TIME) {
          // Ground jump, with coyote time + input buffering
          this.jump(JUMP_VELOCITY);
          this.lastGrounded = -Infinity;
          this.fx.jump();
          this.sfx.jump();
          this.pixel?.jumped();
        } else if (jumpQueued && this.airJumpsLeft > 0 && this.timeToLand() > this.jumpBuffer
                   && !(this.sprung && body.velocity.y < -AIR_JUMP_VELOCITY)) {
          // Air jump: replaces any fall speed so it always gives a real boost.
          // Skipped while the player will land before the buffer runs out, so an early press becomes a ground jump.
          // Also skipped while a spring bounce is still rising faster than an air jump, so it isn't wasted.
          this.jump(AIR_JUMP_VELOCITY);
          this.airJumpsLeft--;
          this.fx.airJump();
          this.sfx.airJump();
          this.pixel?.airJumped();
        }

        // Variable jump height: releasing early cuts the rise
        if (this.rising && !jumpHeld && body.velocity.y < 0) {
          body.setVelocityY(body.velocity.y * JUMP_CUT);
          this.rising = false;
        }
        if (body.velocity.y >= 0) this.rising = false;
        if (body.velocity.y >= 0 || onGround) {
          this.sprung = false;
          body.maxVelocity.y = MAX_FALL_SPEED;
        }

        if (!this.dying && !this.won) this.player.setFillStyle(this.airJumpsLeft > 0 ? PLAYER_COLOR : PLAYER_SPENT_COLOR);
      }

      // Standing on something solid. Only collisions count: Phaser also sets body.touching on overlaps, which would
      // make an orb or door trigger at the player's feet count as ground. Ignored while moving up, so the frame
      // right after takeoff doesn't count.
      onGround() {
        const body = this.player.body;
        return body.blocked.down && body.velocity.y >= 0;
      }

      // Seconds until the player falls onto a platform below, assuming no input (Infinity if none).
      // Crumbling blocks count while they are solid.
      timeToLand() {
        const body = this.player.body;
        const vy = body.velocity.y;
        let best = Infinity;
        for (const p of [...this.platforms.getChildren(), ...this.crumbles.getChildren()]) {
          const pb = p.body;
          if (!pb.enable) continue;
          if (pb.right <= body.left || pb.left >= body.right || pb.top < body.bottom - 1) continue;
          const d = pb.top - body.bottom;
          const t = (-vy + Math.sqrt(vy * vy + 2 * GRAVITY * d)) / GRAVITY;
          best = Math.min(best, t);
        }
        return best;
      }

      jump(velocity) {
        this.player.body.setVelocityY(-velocity);
        this.jumpBuffer = 0;
        this.rising = true;
      }
    }

    const game = window.__game = new Phaser.Game({
      type: Phaser.AUTO,
      parent: 'game',
      width: GAME_WIDTH,
      height: GAME_HEIGHT,
      backgroundColor: '#2a2d3e',
      physics: { default: 'arcade', arcade: { gravity: { y: GRAVITY } } },
      scene: Main,
    });
  </script>
</body>
</html>
